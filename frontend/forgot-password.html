<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset password - Langly</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-gradient: linear-gradient(180deg, #f5f7ff 0%, #eae5ff 45%, #ddf9ff 100%);
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #14b8a6;
      --text-main: #0f172a;
      --text-muted: #6b7280;
      --danger: #dc2626;
      --success: #059669;
      --card-bg: rgba(255, 255, 255, 0.9);
      --border-radius-card: 24px;
      --border-radius-input: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 64px;
      padding: 0 120px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
    }

    .logo {
      font-family: "Sora", system-ui, sans-serif;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: 0.02em;
      color: var(--primary);
    }

    .header-link {
      font-size: 14px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .header-link:hover {
      text-decoration: underline;
    }

    .page {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 16px 64px;
    }

    .card {
      width: 420px;
      max-width: 100%;
      background: var(--card-bg);
      border-radius: var(--border-radius-card);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.16);
      padding: 32px 32px 28px;
    }

    .card-title {
      font-size: 24px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 6px;
      color: var(--primary);
    }

    .card-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .field input {
      width: 100%;
      height: 56px;
      padding: 0 14px;
      border-radius: var(--border-radius-input);
      border: 1px solid rgba(20, 184, 166, 0.65);
      background: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(20, 184, 166, 0.25);
    }

    .field input.input-error {
      border-color: var(--danger);
      box-shadow: 0 0 0 1px rgba(220, 38, 38, 0.16);
    }

    .field input.input-error:focus {
      border-color: var(--danger);
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.16);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 48px;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .password-toggle:hover {
      background: rgba(79, 70, 229, 0.08);
      color: var(--primary);
    }

    .password-toggle:focus-visible {
      outline: 2px solid rgba(79, 70, 229, 0.2);
      outline-offset: 2px;
    }

    .password-toggle-icon {
      position: relative;
      width: 18px;
      height: 18px;
    }

    .password-toggle-icon::before,
    .password-toggle-icon::after {
      content: "";
      position: absolute;
    }

    .password-toggle-icon::before {
      inset: 3px 0 3px 0;
      border: 1.8px solid currentColor;
      border-radius: 50% / 62%;
    }

    .password-toggle-icon::after {
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      background: currentColor;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .password-toggle.is-visible .password-toggle-icon::before,
    .password-toggle.is-visible .password-toggle-icon::after {
      opacity: 0.52;
    }

    .password-toggle.is-visible .password-toggle-icon {
      overflow: hidden;
      background:
        linear-gradient(
          135deg,
          transparent 43%,
          currentColor 43%,
          currentColor 57%,
          transparent 57%
        );
    }

    .field-error {
      font-size: 12px;
      line-height: 1.35;
      color: var(--danger);
      display: none;
    }

    .field-error:not(:empty) {
      display: block;
      margin-top: 6px;
    }

    .btn {
      width: 100%;
      height: 56px;
      border-radius: 999px;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .small-text {
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
      color: var(--text-muted);
    }

    .small-text a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .small-text a:hover {
      text-decoration: underline;
    }

    #message {
      margin-top: 8px;
      font-size: 13px;
      min-height: 18px;
      text-align: center;
    }

    #message.error {
      color: var(--danger);
    }

    #message.success {
      color: var(--success);
    }

    @media (max-width: 768px) {
      .header {
        padding: 0 20px;
      }

      .page {
        padding: 24px 12px 40px;
      }

      .card {
        padding: 24px 20px 22px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">Langly</div>
    <a href="login.html" class="header-link" data-ui-text="auth.back_login">Back to log in</a>
  </header>

  <main class="page">
    <div class="card">
      <h1 class="card-title" data-ui-text="auth.reset_title">Reset your password</h1>
      <p class="card-subtitle" data-ui-text="auth.reset_subtitle">
        Enter the email you used for Langly and choose a new password.
      </p>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="email" data-ui-text="common.email">Email</label>
          <input id="email" type="email" inputmode="email" autocomplete="email" required />
          <div class="field-error" id="email-error"></div>
        </div>

        <div class="field">
          <label for="new-password" data-ui-text="auth.new_password">New password</label>
          <div class="password-wrap">
            <input
              id="new-password"
              type="password"
              autocomplete="new-password"
              minlength="7"
              required
            />
            <button
              class="password-toggle"
              type="button"
              data-toggle-password
              data-target="new-password"
              aria-label="Show password"
              data-ui-aria-label="common.show_password"
            >
              <span class="password-toggle-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div class="field-error" id="new-password-error"></div>
        </div>

        <div class="field">
          <label for="confirm-password" data-ui-text="auth.confirm_new_password">Confirm new password</label>
          <div class="password-wrap">
            <input
              id="confirm-password"
              type="password"
              autocomplete="new-password"
              minlength="7"
              required
            />
            <button
              class="password-toggle"
              type="button"
              data-toggle-password
              data-target="confirm-password"
              aria-label="Show password"
              data-ui-aria-label="common.show_password"
            >
              <span class="password-toggle-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div class="field-error" id="confirm-password-error"></div>
        </div>

        <button type="submit" class="btn" data-ui-text="auth.save_new_password">Save new password</button>
      </form>

      <div id="message"></div>

      <div class="small-text">
        <span data-ui-text="auth.remembered">Remembered it?</span> <a href="login.html" data-ui-text="auth.login">Log in</a>
      </div>
    </div>
  </main>

  <script src="js/interface-language.js"></script>
  <script>
    const form = document.getElementById("reset-form");
    const messageBox = document.getElementById("message");
    const t = (key, fallback) => {
      const value = window.langlyUiText?.t(key);
      return value && value !== key ? value : fallback;
    };

    window.langlyUiText?.init?.().then(() => {
      window.langlyUiText?.apply(document);
    });

    const EMAIL_RULE_TEXT = t("auth.email_rule", "Enter a valid email address with @.");
    const PASSWORD_RULE_TEXT = t(
      "auth.password_rule",
      "Password must be at least 7 characters long and contain at least one letter and one digit."
    );
    const emailInput = document.getElementById("email");
    const newPasswordInput = document.getElementById("new-password");
    const confirmPasswordInput = document.getElementById("confirm-password");
    const emailError = document.getElementById("email-error");
    const newPasswordError = document.getElementById("new-password-error");
    const confirmPasswordError = document.getElementById("confirm-password-error");

    function setMessage(text, type) {
      messageBox.textContent = text || "";
      messageBox.className = type ? type : "";
    }

    function isValidEmail(email) {
      const normalized = String(email || "").trim().toLowerCase();
      const [localPart, domainPart, ...rest] = normalized.split("@");
      return Boolean(localPart && domainPart && rest.length === 0);
    }

    function isStrongPassword(password) {
      return /^(?=.*[A-Za-z])(?=.*\d).{7,}$/.test(String(password || ""));
    }

    function setFieldError(input, errorElement, text) {
      if (input) input.classList.toggle("input-error", Boolean(text));
      if (errorElement) errorElement.textContent = text || "";
    }

    function validateEmailField() {
      const email = emailInput.value.trim().toLowerCase();

      if (!email) {
        setFieldError(emailInput, emailError, t("auth.email_required", "Please enter your email."));
        return false;
      }

      if (!isValidEmail(email)) {
        setFieldError(emailInput, emailError, EMAIL_RULE_TEXT);
        return false;
      }

      setFieldError(emailInput, emailError, "");
      return true;
    }

    function validateNewPasswordField() {
      const password = newPasswordInput.value.trim();

      if (!password) {
        setFieldError(newPasswordInput, newPasswordError, t("auth.new_password_required", "Please enter a new password."));
        return false;
      }

      if (!isStrongPassword(password)) {
        setFieldError(newPasswordInput, newPasswordError, PASSWORD_RULE_TEXT);
        return false;
      }

      setFieldError(newPasswordInput, newPasswordError, "");
      return true;
    }

    function validateConfirmPasswordField() {
      const password = newPasswordInput.value.trim();
      const confirmPassword = confirmPasswordInput.value.trim();

      if (!confirmPassword) {
        setFieldError(confirmPasswordInput, confirmPasswordError, t("auth.confirm_new_required", "Please confirm your new password."));
        return false;
      }

      if (password && password !== confirmPassword) {
        setFieldError(confirmPasswordInput, confirmPasswordError, t("auth.passwords_no_match", "Passwords do not match."));
        return false;
      }

      setFieldError(confirmPasswordInput, confirmPasswordError, "");
      return true;
    }

    function bindLiveValidation(input, validate) {
      let touched = false;

      input.addEventListener("blur", () => {
        touched = true;
        validate();
      });

      input.addEventListener("input", () => {
        if (touched || form.dataset.submitted === "1") {
          validate();
        }
        setMessage("", "");
      });
    }

    function initPasswordToggles() {
      document.querySelectorAll("[data-toggle-password]").forEach((button) => {
        button.addEventListener("click", () => {
          const input = document.getElementById(button.dataset.target || "");
          if (!input) return;

          const shouldShow = input.type === "password";
          input.type = shouldShow ? "text" : "password";
          button.classList.toggle("is-visible", shouldShow);
          button.setAttribute("aria-label", shouldShow ? t("common.hide_password", "Hide password") : t("common.show_password", "Show password"));
        });
      });
    }

    initPasswordToggles();
    bindLiveValidation(emailInput, validateEmailField);
    bindLiveValidation(newPasswordInput, () => {
      const passwordOk = validateNewPasswordField();
      if (confirmPasswordInput.value.trim()) {
        validateConfirmPasswordField();
      }
      return passwordOk;
    });
    bindLiveValidation(confirmPasswordInput, validateConfirmPasswordField);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      form.dataset.submitted = "1";
      setMessage("", "");

      const emailOk = validateEmailField();
      const passwordOk = validateNewPasswordField();
      const confirmOk = validateConfirmPasswordField();

      if (!emailOk || !passwordOk || !confirmOk) {
        return;
      }

      const email = emailInput.value.trim().toLowerCase();
      const newPassword = newPasswordInput.value.trim();
      const confirmPassword = confirmPasswordInput.value.trim();

      try {
        const res = await fetch("http://127.0.0.1:8000/users/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email,
            new_password: newPassword,
            confirm_new_password: confirmPassword,
          }),
        });

        const data = await res.json();

        if (!res.ok) {
          setMessage(data.detail || t("auth.reset_failed", "Could not reset password."), "error");
          return;
        }

        setMessage(t("auth.reset_success", "Password changed successfully! Redirecting to log in..."), "success");

        setTimeout(() => {
          window.location.replace("login.html");
        }, 1200);
      } catch (err) {
        console.error(err);
        setMessage(t("auth.api_running_error", "Cannot connect to API. Is the server running?"), "error");
      }
    });
  </script>
</body>
</html>
