<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign up – Langly</title>

  <!-- Sora из Google Fonts для логотипа -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/signup.css">
</head>

<body class="page-pending">
  <!-- HEADER -->
  <header class="top-bar">
    <a href="index.html" class="brand">Langly</a>
    <a href="login.html" class="top-link" data-ui-text="auth.login">Log in</a>
  </header>

  <!-- MAIN -->
  <main class="page">
    <div class="auth-card">
      <img src="img/book_star.png" alt="Langly" class="auth-illustration" />

      <h1 class="auth-title" data-ui-text="auth.create_account">Create your account</h1>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="email" data-ui-text="common.email">Email</label>
          <input id="email" type="email" inputmode="email" autocomplete="email" required />
          <div class="field-error" id="email-error"></div>
        </div>

        <div class="field">
          <label for="password" data-ui-text="common.password">Password</label>
          <div class="password-wrap">
            <input id="password" type="password" autocomplete="new-password" minlength="7" required />
            <button
              class="password-toggle"
              type="button"
              data-toggle-password
              data-target="password"
              aria-label="Show password"
              data-ui-aria-label="common.show_password"
            >
              <span class="password-toggle-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div class="field-error" id="password-error"></div>
        </div>

        <div class="field">
          <label for="confirm" data-ui-text="auth.confirm_password">Confirm password</label>
          <div class="password-wrap">
            <input id="confirm" type="password" autocomplete="new-password" minlength="7" required />
            <button
              class="password-toggle"
              type="button"
              data-toggle-password
              data-target="confirm"
              aria-label="Show password"
              data-ui-aria-label="common.show_password"
            >
              <span class="password-toggle-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div class="field-error" id="confirm-error"></div>
        </div>

        <div class="field">
          <label data-ui-text="auth.native_language">Your native language</label>

          <div class="custom-select" id="native-select">
            <div class="select-trigger">
              <span id="selected-value" data-ui-text="auth.select_language">Select a language</span>
              <div class="arrow"></div>
            </div>

            <div class="select-options" id="select-options">
            <!-- JS вставит языки сюда -->
            </div>
          </div>
        </div>

    
        <div class="checkbox-row">
          <input id="terms" type="checkbox" />
          <label for="terms" style="margin:0;">
            <span data-ui-text="auth.terms_prefix">I agree to</span> <a href="terms.html" data-ui-text="auth.terms">Terms</a>
          </label>
        </div>

        <button type="submit" class="btn-primary" data-ui-text="auth.signup">Sign up</button>
      </form>

      <div id="message"></div>

      <div class="auth-footer">
        <span data-ui-text="auth.have_account">Already have an account?</span> <a href="login.html" data-ui-text="auth.login">Log in</a>
      </div>
    </div>
  </main>
<script src="js/interface-language.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
