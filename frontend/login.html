<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Log in – Langly</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
  
</head>

<body>
  <!-- HEADER -->
  <header class="header">
    <div class="logo">Langly</div>
    <a class="header-link" href="signup.html" data-ui-text="auth.signup">Sign up</a>
  </header>

  <!-- MAIN -->
  <main class="container">

    <!-- LEFT CARD -->
    <section class="card">
      <h1 data-ui-text="auth.login">Log in</h1>

      <form id="login-form">
        <label class="field-label" data-ui-text="common.email">Email</label>
        <input id="email" type="email" class="text-input" />

        <label class="field-label" style="margin-top: 14px;" data-ui-text="common.password">Password</label>
        <div class="password-wrap">
          <input id="password" type="password" class="text-input" />
          <button
            class="password-toggle"
            type="button"
            id="password-toggle"
            aria-label="Show password"
            data-ui-aria-label="common.show_password"
          >
            <span class="password-toggle-icon" aria-hidden="true"></span>
          </button>
        </div>

        <div class="forgot-row">
          <a href="forgot-password.html" data-ui-text="auth.forgot_password">Forgot password?</a>
        </div>

        <button class="btn-primary" type="submit" data-ui-text="auth.login">Log in</button>

        <p id="message"></p>

        <p class="below-text">
          <span data-ui-text="auth.no_account">Don't have an account?</span>
          <a href="signup.html" data-ui-text="auth.signup">Sign up</a>
        </p>
      </form>
    </section>

    <!-- RIGHT IMAGE -->
    <section>
      <img src="img/couple_login.png" class="illustration" alt="studying couple" />
    </section>

  </main>

  <script src="js/interface-language.js"></script>
  <script>
  const form = document.getElementById("login-form");
  const messageBox = document.getElementById("message");
  const passwordInput = document.getElementById("password");
  const passwordToggle = document.getElementById("password-toggle");
  const t = (key, fallback) => {
    const value = window.langlyUiText?.t(key);
    return value && value !== key ? value : fallback;
  };

  window.langlyUiText?.init?.().then(() => {
    window.langlyUiText?.apply(document);
  });

  passwordToggle?.addEventListener("click", () => {
    const shouldShow = passwordInput.type === "password";
    passwordInput.type = shouldShow ? "text" : "password";
    passwordToggle.classList.toggle("is-visible", shouldShow);
    passwordToggle.setAttribute("aria-label", shouldShow ? t("common.hide_password", "Hide password") : t("common.show_password", "Show password"));
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    messageBox.textContent = "";

    const emailInput = document.getElementById("email");

    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    if (!email || !password) {
      messageBox.textContent = t("auth.login_required", "Please enter your email and password.");
      messageBox.style.color = "#e11d48";
      return;
    }

    try {
      //form-urlencoded
      const formData = new URLSearchParams();
      formData.append("username", email);
      formData.append("password", password);

      const res = await fetch("http://127.0.0.1:8000/users/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: formData
      });

      const data = await res.json();

      if (!res.ok) {
        messageBox.textContent = data.detail || t("auth.login_failed", "Login failed.");
        messageBox.style.color = "#e11d48";
        return;
      }

      //saving token
      localStorage.setItem("token", data.access_token);

      const meRes = await fetch("http://127.0.0.1:8000/users/me", {
        headers: {
          "Authorization": `Bearer ${data.access_token}`
        }
      });

      const meData = meRes.ok ? await meRes.json() : null;

      if (meData?.active_language_id) {
        window.location.replace("dashboard.html");
      } else {
        window.location.replace("choose-language.html");
      }

    } catch {
      messageBox.textContent = t("auth.api_error", "Cannot connect to API.");
      messageBox.style.color = "#e11d48";
    }
  });
</script>
</body>
</html>
