<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Langly – Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body class="langly-i18n-pending page-pending">

<header class="top-bar">
    <div class="brand" id="logo">Langly</div>
    <button id="logout-btn" class="logout-btn" data-ui-text="common.logout">Log out</button>
</header>

<div class="app-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="welcome-container">
            <div class="welcome-card focus-card dashboard-welcome-placeholder" aria-hidden="true">
                <div class="focus-kicker" data-ui-text="dashboard.focus">TODAY'S FOCUS</div>
                <div class="focus-main">
                    <div class="focus-title" data-ui-text="dashboard.focus_title">Learn a small set and mark what sticks.</div>
                    <div class="focus-meta" data-ui-text="dashboard.loading_progress">Loading your progress...</div>
                    <div class="focus-progress-row">
                        <div class="focus-progress-label" data-ui-text="dashboard.level_progress">Level progress</div>
                        <div class="focus-progress-percent">--%</div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width:0%"></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="discovery-container"></div>
    </main>
</div>

<script src="js/interface-language.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>

</body>

</html>
